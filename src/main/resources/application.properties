spring.application.name=chetan-portfolio
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chetan_portfolio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Portfolio content and contact messages are stored in MySQL.
# Configure ADMIN_USERNAME and ADMIN_PASSWORD before using the admin API.
